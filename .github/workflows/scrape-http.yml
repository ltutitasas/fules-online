name: Scrape HTTP saitai

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Kiek scrape ciklų atlikti viename rune (su 40s pauzėm)'
        required: false
        default: '1'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Įdiegti priklausomybes
        run: pip install requests beautifulsoup4 lxml

      - name: Paleisti HTTP scraperį
        env:
          KV_REST_API_URL:      ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN:    ${{ secrets.KV_REST_API_TOKEN }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          CYCLES:               ${{ github.event.inputs.cycles || '1' }}
        run: python scraper/run_http.py
