# ⚠️ Failo vardo NEKEISTI – cron-job.org Job 2 kreipiasi į
# /actions/workflows/scrape-http.yml/dispatches (kas 2 min).
name: Scrape RSS + HTTP saitai

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Kiek scrape ciklų viename rune (kas CYCLE_INTERVAL s)'
        required: false
        default: '2'

# Vienu metu – tik VIENAS runas, o laukti gali daugiausiai vienas (GitHub naujesnį
# laukiantį pakeičia, seną laukiantį atšaukia) – runai nesikaupia net per GitHub
# gedimus (2026-08-05 major outage susikaupė 100+). cancel-in-progress: false –
# besisukantis runas NENUTRAUKIAMAS, kad ciklas nebūtų nukirstas pusiaukelėje
# (tarp notified_ids įrašymo ir Telegram išsiuntimo).
concurrency:
  group: scrape-http
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Įdiegti priklausomybes
        run: pip install requests beautifulsoup4 lxml feedparser flask

      # RSS + HTTP vienu KV ciklu (scraper/run_all.py). 2 ciklai kas 60 s:
      # runas paleidžiamas kas 2 min, tad saitai tikrinami ~kas minutę – už tą
      # pačią Upstash kainą, kaip anksčiau RSS (Vercel) + HTTP (Actions) atskirai.
      - name: Paleisti scraperį
        env:
          KV_REST_API_URL:      ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN:    ${{ secrets.KV_REST_API_TOKEN }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          CYCLES:               ${{ github.event.inputs.cycles || '2' }}
          CYCLE_INTERVAL:       '60'
          PUBLIC_URL:           ${{ vars.PUBLIC_URL }}
        run: python scraper/run_all.py
