name: Scrape naujienos

# Schedule išjungtas 2026-06-11: senas run.py turi savo pasenusią saitų kopiją
# ir rašo seną KV formatą – konfliktuotų su run_http.py/api/index.py.
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Įdiegti priklausomybes
        run: pip install feedparser beautifulsoup4 requests

      - name: Paleisti scraperį
        env:
          KV_REST_API_URL:      ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN:    ${{ secrets.KV_REST_API_TOKEN }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper/run.py
